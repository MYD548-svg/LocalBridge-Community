name: Publish verified community release
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Community Build run ID whose artifacts will be reused
        required: true
        type: string
      tag:
        description: Existing tag pointing to that exact source commit (vX.Y.Z-community.1)
        required: true
        type: string
      publish:
        description: Publish the verified pair as a public formal release
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  publish:
    if: inputs.publish
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Bind publication to the successful source run
        id: source
        uses: actions/github-script@v7
        env:
          INPUT_BUILD_RUN_ID: ${{ inputs.run_id }}
        with:
          script: |
            const fs = require('node:fs');
            const config = JSON.parse(fs.readFileSync('product-release.json', 'utf8'));
            const runId = Number(process.env.INPUT_BUILD_RUN_ID);
            if (!Number.isSafeInteger(runId) || runId <= 0 || `${context.repo.owner}/${context.repo.repo}` !== config.repository) throw new Error('Invalid source run or repository');
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: runId });
            if (run.conclusion !== 'success' || run.status !== 'completed' || run.path.split('@')[0] !== '.github/workflows/community-build.yml' || run.head_repository.full_name !== config.repository) throw new Error('A completed successful Community Build from this repository is required');
            const head = require('node:child_process').execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
            if (head !== run.head_sha) throw new Error('Tag differs from the verified source commit');
            core.setOutput('sha', run.head_sha);
      - uses: actions/download-artifact@v4
        with:
          name: community-release-candidate
          run-id: ${{ inputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: verified-candidate
      - name: Verify and publish existing artifacts without rebuilding
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERIFIED_SOURCE_COMMIT: ${{ steps.source.outputs.sha }}
          INPUT_RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/release-candidate.mjs publish verified-candidate
