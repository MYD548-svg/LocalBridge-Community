name: LocalBridge Community Build
on:
  push:
    branches: [main, "release/*"]
    tags: ["v*.*.*-community.*"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  upstream-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: openai/tunnel-client
          ref: 8d55683eeef80bc5e360d95abf4692454fafc615
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify pinned source and run full upstream suite
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "8d55683eeef80bc5e360d95abf4692454fafc615"
          go test -mod=readonly -timeout=15m ./...
  build:
    name: Build and Verify on Windows
    needs: upstream-tests
    runs-on: windows-latest
    env:
      LOCALBRIDGE_BUILD_PROFILE: community
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: false
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Cache Cargo downloads and compilation dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/debug/deps
            src-tauri/target/debug/build
            src-tauri/target/debug/.fingerprint
            src-tauri/target/release/deps
            src-tauri/target/release/build
            src-tauri/target/release/.fingerprint
          key: cargo-${{ runner.os }}-1.85.0-x86_64-pc-windows-msvc-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/build.rs', 'src-tauri/tauri.conf.json', '.cargo/config.toml', 'src-tauri/.cargo/config.toml') }}
      - name: Shared build and verification gate
        run: node scripts/test/ci-gate.mjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-diagnostics
          path: |
            tests/artifacts/ci/
            src-tauri/target/release-stage/*.json
            src-tauri/target/local-mcp-stage/*.json
            src-tauri/target/browser-host-stage/*.json
            tests/artifacts/browser-extension/extension-build.json
            tests/artifacts/browser-extension-dev/extension-build.json
          if-no-files-found: warn
      - name: Upload verified installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: community-verified-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - name: Upload browser extension candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: community-chatgpt-web-extension-candidate
          path: |
            tests/artifacts/browser-extension/*.zip
            tests/artifacts/browser-extension/SHA256SUMS.txt
            tests/artifacts/browser-extension/extension-build.json
            extensions/chatgpt-web/INSTALL.html
            extensions/chatgpt-web/INSTALL.svg
            tests/artifacts/ci/BUILD-PROVENANCE.json
            tests/artifacts/ci/SHA256SUMS.txt
          if-no-files-found: error
