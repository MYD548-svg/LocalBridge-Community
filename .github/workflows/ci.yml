name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Shared build and verification gate
        run: node scripts/test/ci-gate.mjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: tests/artifacts/ci/
          if-no-files-found: warn
      - name: Upload verified installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bundled-verified-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
