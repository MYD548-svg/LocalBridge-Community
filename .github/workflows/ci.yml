name: CI
on:
  push:
    branches-ignore: [main, "release/**"]
    tags-ignore: ["**"]
  pull_request:
    branches-ignore: [main, "release/**"]
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.85.0
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy
      - name: Cache Cargo downloads and compilation dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target/debug/deps
            src-tauri/target/debug/build
            src-tauri/target/debug/.fingerprint
            src-tauri/target/release/deps
            src-tauri/target/release/build
            src-tauri/target/release/.fingerprint
          key: cargo-${{ runner.os }}-1.85.0-x86_64-pc-windows-msvc-${{ hashFiles('src-tauri/Cargo.lock', 'src-tauri/Cargo.toml', 'src-tauri/build.rs', 'src-tauri/tauri.conf.json', '.cargo/config.toml', 'src-tauri/.cargo/config.toml') }}
      - name: Shared build and verification gate
        run: node scripts/test/ci-gate.mjs
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-diagnostics
          path: |
            tests/artifacts/ci/
            src-tauri/target/release-stage/*.json
            src-tauri/target/local-mcp-stage/*.json
            src-tauri/target/browser-host-stage/*.json
            src-tauri/target/browser-extension-stage/bundle.json
            tests/artifacts/browser-extension/extension-build.json
            tests/artifacts/browser-extension-dev/extension-build.json
          if-no-files-found: warn
      - name: Upload verified installer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bundled-verified-installer
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
      - name: Upload complete release candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: bundled-release-candidate
          path: |
            tests/artifacts/release/
            tests/artifacts/ci/TEST-REPORT.json
            tests/artifacts/ci/BUILD-PROVENANCE.json
          if-no-files-found: error
      - name: Upload browser extension candidate
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-web-extension-candidate
          path: |
            tests/artifacts/browser-extension/*.zip
            tests/artifacts/browser-extension/SHA256SUMS.txt
            tests/artifacts/browser-extension/extension-build.json
            extensions/chatgpt-web/INSTALL.html
            extensions/chatgpt-web/INSTALL.svg
            tests/artifacts/ci/BUILD-PROVENANCE.json
            tests/artifacts/ci/SHA256SUMS.txt
          if-no-files-found: error
