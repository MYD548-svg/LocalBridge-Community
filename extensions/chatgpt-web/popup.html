<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LocalBridge 网页工具</title><link rel="stylesheet" href="popup.css"></head>
<body><h1>LocalBridge 网页工具</h1><p>本机执行；回填结果会进入在线聊天。</p><p id="status" role="status">正在检查当前聊天…</p><p id="error" role="alert"></p>
<div class="actions"><button id="connect">连接这台电脑</button><button id="enable">为此聊天启用工具</button><button id="disconnect">停止并断开</button></div>
<details><summary>选择本轮工具</summary><div id="tools"></div></details><button id="instructions">填入工具说明，随后手动发送</button>
<h2>待确认请求</h2><pre id="candidate">等待新的助手工具请求</pre><div class="actions"><button id="execute">确认执行以上请求</button><button id="cancel">取消当前执行</button></div>
<h2>实际结果</h2><pre id="result">尚未执行</pre><div class="actions"><button id="fill">填入结果，随后手动发送</button><button id="copy">复制结果</button></div>
<details><summary>连接帮助</summary><p>先安装 LocalBridge 并启动本地服务。扩展从 GitHub 下载 ZIP，在应用内导入后，开启浏览器开发者模式，加载应用显示的固定目录。</p><p>首次配对请在 LocalBridge 确认。切换工作区后重新授权；刷新或切换聊天后重新启用。输入框有草稿时会暂停回填。</p><button id="reset">重置扩展配对身份</button></details>
<script type="module" src="popup.js"></script></body></html>
